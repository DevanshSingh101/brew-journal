# One-click deploy on Render: New → Blueprint → pick this repo.
# The database is MongoDB Atlas (free M0 cluster); paste its connection string
# into MONGODB_URI when Render asks for it.
services:
  - type: web
    name: brew-journal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /guide
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: brew-journal
